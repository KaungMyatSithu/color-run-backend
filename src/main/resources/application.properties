spring.application.name=color-run-backend

server.port=9090
app.cors.allowed-origin=http://localhost:4200
firebase.service-account-path=event-registration-syste-9461f-firebase-adminsdk-fbsvc-dff7696146.json
google.drive.oauth.client-id=${GOOGLE_DRIVE_CLIENT_ID}
google.drive.oauth.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET}
google.drive.oauth.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Email is deliberately disabled until the team enters real SMTP credentials.
# Never commit real credentials. Prefer environment variables when deploying.
app.email.enabled=false
app.email.from=YOUR_EVENT_EMAIL_ADDRESS
app.email.from-name=ColourWave Registration Team
spring.mail.host=YOUR_SMTP_HOST
spring.mail.port=587
spring.mail.username=YOUR_SMTP_USERNAME
spring.mail.password=YOUR_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
